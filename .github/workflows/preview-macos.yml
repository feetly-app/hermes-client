name: Preview macOS

# Builds the app for macOS and shares it as a Tuist Preview.
# The build is ad hoc signed: no certificate is needed.
# Can be run manually (workflow_dispatch) or triggered by the preview trigger workflow (workflow_call).
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: preview-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Tuist OIDC authentication

env:
  # Tuist server project, read by Tuist.swift. Update if the Tuist project uses a different handle.
  TUIST_SERVER_FULL_HANDLE: mtm-capital/hermes-client

jobs:
  preview:
    name: macOS preview
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}.${{ github.run_id }}
      # Tuist keys uploads on (binary ID, version). The simulator binary is a stub with a stable ID,
      # so the marketing version must change per run as well, or the upload is rejected as a duplicate.
      MARKETING_VERSION_PREVIEW: 5.1.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Generate Tuist project
        run: |
          tuist install
          tuist generate --no-open
      - name: Build for macOS
        run: |
          tuist xcodebuild build \
            -workspace Hermes.xcworkspace \
            -scheme Hermes \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION_PREVIEW" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: Share macOS preview
        run: tuist share Hermes --configuration Debug --platforms macos
