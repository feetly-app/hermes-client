name: Preview iOS

# Builds an ad hoc signed IPA and the iOS Simulator, in parallel jobs, and shares both as Tuist Previews when
# the `preview-ios` label is added to an open pull request. The IPA installs on the devices registered in the Apple Developer account. It needs the
# App Store Connect API key secrets. The label is removed as soon as the run starts: add it again to rebuild.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  id-token: write # Tuist OIDC authentication
  pull-requests: write # Remove the preview label

env:
  # Tuist server project, read by Tuist.swift. Update if the Tuist project uses a different handle.
  TUIST_SERVER_FULL_HANDLE: mtm-capital/hermes-client

jobs:
  preview:
    name: Device preview
    if: github.event.label.name == 'preview-ios' && github.event.pull_request.state == 'open'
    runs-on: xcode-27
    concurrency:
      group: preview-ios-device-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
      cancel-in-progress: true
    timeout-minutes: 60
    env:
      # The Apple Distribution certificate is imported from a fixed .p12 secret on every run, so that Xcode
      # reuses it instead of creating a new certificate each time (Apple caps the number of certificates).
      # App Store Connect API key with the Admin role, so that Xcode can create or refresh the ad hoc
      # provisioning profile.
      # - APPLE_DISTRIBUTION_P12_BASE64: the Apple Distribution certificate and private key, exported as .p12, base64-encoded
      # - APPLE_DISTRIBUTION_P12_PASSWORD: the password of that .p12
      # - APP_STORE_CONNECT_API_KEY_BASE64: the .p8 key, base64-encoded
      # - APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID: key identifiers
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      # Tuist keys uploads on (binary ID, version): the marketing version must change per run as well.
      MARKETING_VERSION_PREVIEW: 5.1.${{ github.run_number }}
    steps:
      - name: Remove the preview-ios label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label preview-ios
      - name: Check the App Store Connect secrets
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "::error::The App Store Connect secrets are missing: the device preview cannot be built."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Generate Tuist project
        run: |
          tuist install
          tuist generate --no-open
      - name: Install App Store Connect API key
        id: api-key
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$API_KEY_PATH"
          echo "path=$API_KEY_PATH" >> "$GITHUB_OUTPUT"
      - name: Import the signing certificates
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          DEV_P12_BASE64: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          DEV_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::APPLE_DISTRIBUTION_P12_BASE64 or APPLE_DISTRIBUTION_P12_PASSWORD is missing: the device preview cannot be signed."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Apple Distribution: signs the archive and exports the IPA.
          P12_PATH="$RUNNER_TEMP/distribution.p12"
          echo -n "$P12_BASE64" | base64 --decode -o "$P12_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12_PATH"
          # Apple Development: when it is stored, Xcode finds it here and does not request a new
          # development certificate from Apple, which fails once the account reaches its limit.
          if [ -n "$DEV_P12_BASE64" ] && [ -n "$DEV_P12_PASSWORD" ]; then
            DEV_P12_PATH="$RUNNER_TEMP/development.p12"
            echo -n "$DEV_P12_BASE64" | base64 --decode -o "$DEV_P12_PATH"
            security import "$DEV_P12_PATH" -k "$KEYCHAIN" -P "$DEV_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$DEV_P12_PATH"
          else
            echo "::warning::APPLE_DEVELOPMENT_P12_BASE64 is not set: Xcode may request a new development certificate from Apple."
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed 's/^ *"//; s/"$//')"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Archive for iOS devices
        run: |
          xcodebuild archive \
            -workspace Hermes.xcworkspace \
            -scheme Hermes \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hermes.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.api-key.outputs.path }}" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION_PREVIEW"
      - name: Export ad hoc IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>release-testing</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>S4J5D3N22R</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Hermes.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.api-key.outputs.path }}" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Share device preview
        run: tuist share "$RUNNER_TEMP/export/Hermes.ipa"
      - name: Remove App Store Connect API key
        if: always()
        run: rm -f "${{ steps.api-key.outputs.path }}"
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  simulator:
    name: iOS Simulator preview
    if: github.event.label.name == 'preview-ios' && github.event.pull_request.state == 'open'
    runs-on: xcode-27
    concurrency:
      group: preview-ios-simulator-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
      cancel-in-progress: true
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      # Tuist keys uploads on (binary ID, version): the marketing version must change per run as well.
      MARKETING_VERSION_PREVIEW: 5.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Generate Tuist project
        run: |
          tuist install
          tuist generate --no-open
      - name: Build for the iOS Simulator
        run: |
          tuist xcodebuild build \
            -workspace Hermes.xcworkspace \
            -scheme Hermes \
            -configuration Debug \
            -sdk iphonesimulator \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION_PREVIEW"
      - name: Share simulator preview
        run: tuist share Hermes --configuration Debug --platforms ios
      - name: Dump Tuist session logs
        if: always()
        run: |
          # Temporary debug step: Tuist keeps the upload error only in its session logs.
          find "$HOME/.local/state/tuist/sessions" -name logs.txt 2>/dev/null | while read -r f; do
            echo "::group::$f"
            grep -iE "error|fail|upload|reject|duplicate|status|http" "$f" | tail -200 || true
            echo "::endgroup::"
          done
